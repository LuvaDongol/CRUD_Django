{% extends 'base.html' %} {% block title %}Delete {{ recipe.title }} - Recipe
Vault{% endblock %} {% block content %}
<div class="delete-container">
  <div class="delete-card">
    <h1>⚠️ Delete Recipe</h1>
    <p>
      Are you sure you want to delete <strong>"{{ recipe.title }}"</strong>?
    </p>
    <p class="delete-warning">This action cannot be undone.</p>

    <form method="post">
      {% csrf_token %}
      <div class="form-actions">
        <button type="submit" class="btn btn-danger">🗑️ Yes, Delete</button>
        <a href="{% url 'recipe_detail' recipe.pk %}" class="btn btn-secondary"
          >Cancel</a
        >
      </div>
    </form>
  </div>
</div>
{% endblock %}
