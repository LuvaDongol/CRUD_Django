<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recipe Vault{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            background: linear-gradient(135deg, #16213e, #0f3460);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.3);
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e94560;
            text-decoration: none;
            letter-spacing: 1px;
        }

        nav .logo span {
            color: #eee;
        }

        nav .nav-btn {
            background: #e94560;
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s;
        }

        nav .nav-btn:hover {
            background: #c73652;
            transform: translateY(-2px);
        }

        /* Main content */
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        h1, h2 {
            color: #e94560;
            margin-bottom: 1rem;
        }

        /* Cards grid */
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(233,69,96,0.2);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card .no-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #0f3460, #533483);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .card-body {
            padding: 1.2rem;
        }

        .card-body h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .card-body p {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 0.4rem;
        }

        .badge-difficulty {
            background: #e94560;
            color: white;
        }

        .badge-category {
            background: #533483;
            color: white;
        }

        .badge-time {
            background: #0f3460;
            color: #eee;
        }

        /* Detail page */
        .detail-header {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .detail-header img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
        }

        .detail-section {
            background: #16213e;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .detail-section h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #e94560;
            padding-bottom: 0.5rem;
        }

        .detail-section ul {
            list-style: none;
            padding: 0;
        }

        .detail-section ul li {
            padding: 0.4rem 0;
            border-bottom: 1px solid #1a1a2e;
            color: #ccc;
        }

        .detail-section ul li::before {
            content: "▹ ";
            color: #e94560;
            font-weight: bold;
        }

        .detail-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .meta-item {
            background: #0f3460;
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            text-align: center;
            min-width: 120px;
        }

        .meta-item span {
            display: block;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 0.3rem;
        }

        .meta-item strong {
            color: #e94560;
            font-size: 1.1rem;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-primary:hover {
            background: #c73652;
        }

        .btn-secondary {
            background: #533483;
            color: white;
        }

        .btn-secondary:hover {
            background: #6b44a0;
        }

        .btn-danger {
            background: #c0392b;
            color: white;
        }

        .btn-danger:hover {
            background: #a93226;
        }

        .btn-group {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        /* Forms */
        .form-card {
            background: #16213e;
            border-radius: 12px;
            padding: 2rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: #ccc;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 2px solid #0f3460;
            border-radius: 8px;
            background: #1a1a2e;
            color: #eee;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #e94560;
        }

        .form-input::placeholder {
            color: #555;
        }

        select.form-input {
            appearance: auto;
        }

        /* Delete confirmation */
        .delete-card {
            background: #16213e;
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            margin: 2rem auto;
            text-align: center;
        }

        .delete-card h2 {
            color: #c0392b;
        }

        .delete-card p {
            color: #ccc;
            margin: 1rem 0;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: #555;
        }

        .empty-state h2 {
            color: #555;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: #444;
            font-size: 0.85rem;
            margin-top: 3rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .recipe-grid {
                grid-template-columns: 1fr;
            }

            .detail-meta {
                flex-direction: column;
            }
        }

        /* Error list */
        .errorlist {
            color: #e94560;
            list-style: none;
            padding: 0;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'recipe_list' %}" class="logo">Recipe<span>Vault</span></a>
        <a href="{% url 'recipe_create' %}" class="nav-btn">+ Add Recipe</a>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        &copy; 2026 RecipeVault &mdash; Your Personal Recipe Manager
    </footer>
</body>
</html>
